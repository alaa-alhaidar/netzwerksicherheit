services:
  postgres:
    image: postgres:17
    container_name: network-postgres
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    restart: unless-stopped
  sync:
    build:
      context: ..
      dockerfile: docker/Dockerfile.sync
    network_mode: host
    env_file: .env.cloud
    volumes: ["../data:/data"]
    restart: unless-stopped
  pdc:
    image: grafana/pdc-agent:latest
    profiles: [pdc]
    network_mode: host
    env_file: .env.pdc
    entrypoint: [/bin/sh, -c]
    command:
      - 'exec /usr/bin/pdc -token "$$GCLOUD_PDC_SIGNING_TOKEN" -cluster "$$GCLOUD_PDC_CLUSTER" -gcloud-hosted-grafana-id "$$GCLOUD_HOSTED_GRAFANA_ID" -ssh-flag="-o PermitRemoteOpen=127.0.0.1:5432"'
    restart: unless-stopped
  mqtt:
    image: eclipse-mosquitto:2
    ports: ["127.0.0.1:1883:1883"]
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mqtt_data:/mosquitto/data
    restart: unless-stopped
  telemetry:
    build:
      context: ..
      dockerfile: docker/Dockerfile.mqtt
    network_mode: host
    env_file: .env.cloud
    environment:
      MQTT_HOST: 127.0.0.1
      MQTT_PORT: 1883
      MQTT_NODE_ID: lab-01
      SENSOR_IP: 192.168.178.124
    depends_on: [mqtt, postgres]
    restart: unless-stopped

volumes:
  mqtt_data:
  postgres_data:
    external: true
    name: network-monitor_postgres_data
