services:
  postgres:
    image: postgres:17
    container_name: network-postgres
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    restart: unless-stopped
  sync:
    build:
      context: ..
      dockerfile: docker/Dockerfile.sync
    network_mode: host
    env_file: .env.cloud
    volumes: ["../data:/data"]
    restart: unless-stopped
  pdc:
    image: grafana/pdc-agent:latest
    profiles: [pdc]
    network_mode: host
    env_file: .env.pdc
    entrypoint: [/bin/sh, -c]
    command:
      - 'exec /usr/bin/pdc -token "$$GCLOUD_PDC_SIGNING_TOKEN" -cluster "$$GCLOUD_PDC_CLUSTER" -gcloud-hosted-grafana-id "$$GCLOUD_HOSTED_GRAFANA_ID" -ssh-flag="-o PermitRemoteOpen=127.0.0.1:5432"'
    restart: unless-stopped
volumes:
  postgres_data:
    external: true
    name: network-monitor_postgres_data
