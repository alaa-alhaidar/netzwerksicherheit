services:
  scanner:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: ["python", "scanner/netz_monitor.py"]
    network_mode: host
    cap_drop: [ALL]
    cap_add: [NET_RAW]
    environment:
      NETWORK_CIDR: ${NETWORK_CIDR:-auto}
      SCAN_INTERVAL: ${SCAN_INTERVAL:-60}
    volumes:
      - ../data:/data
    restart: unless-stopped
  postgres:
    image: postgres:17
    profiles: [postgres]
    environment:
      POSTGRES_DB: network_monitor
      POSTGRES_USER: monitor_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:-}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sh:/docker-entrypoint-initdb.d/10-init.sh:ro
      - ./postgres/schema.sql:/schema.sql:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U monitor_admin -d network_monitor"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  sync:
    profiles: [postgres]
    build:
      context: ..
      dockerfile: docker/Dockerfile.sync
    network_mode: host
    environment:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGDATABASE: network_monitor
      PGUSER: monitor_admin
      PGPASSWORD: ${POSTGRES_PASSWORD:-}
      SYNC_INTERVAL: 5
    volumes:
      - ../data:/data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
